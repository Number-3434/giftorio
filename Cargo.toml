[package]
name = "giftorio_wasm"
version = "0.1.0"
edition = "2018"

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.13"
console_error_panic_hook = "0.1"
flate2 = { version = "1.0", features = ["zlib"] }
image = "0.24"
js-sys = "0.3.77"
rayon = "1.10.0"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.77"
web-sys = { version = "0.3", features = ["console"] }
